name: Learn navigation evidence from ADS-B trace
on:
  workflow_dispatch:
    inputs:
      trace_url:
        description: Direct URL to a single-aircraft readsb trace JSON (not the multi-GB whole-sky archive)
        required: true
        type: string
      radius_nm:
        description: Maximum distance to match an existing waypoint (NM)
        required: false
        default: "5"
        type: string
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download selected aircraft trace
        run: curl --fail --location --retry 3 "${{ inputs.trace_url }}" -o /tmp/trace.json
      - name: Match ADS-B positions to existing fixes
        run: |
          python scripts/adsb_learning/match_trace.py \
            --trace /tmp/trace.json \
            --waypoints navigation/waypoints/flightgear_fixes.csv \
            --radius-nm "${{ inputs.radius_nm }}"
      - name: Commit evidence database
        run: |
          if git diff --quiet -- navigation/adsb_learning; then
            echo "No new evidence"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation/adsb_learning
          git commit -m "Update ADS-B waypoint learning evidence"
          git push
