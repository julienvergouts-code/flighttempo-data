name: ADS-B corridor benchmark (real archive)

on:
  push:
    branches: [feature/adsb-route-learning]
    paths:
      - "pipeline/**"
      - "scripts/adsb_learning/**"
      - "tests/test_adsb_corridor_builder.py"
      - ".github/workflows/update_corridors.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC archive date (YYYY-MM-DD)"
        required: true
        default: "2026-11-16"
        type: string
      auto_pick_4ca:
        description: "Automatically select first qualifying Ryanair Irish 4CA airframe"
        required: true
        default: false
        type: boolean
      icao24:
        description: "Six-character benchmark ICAO24 hex (ignored in auto-pick mode)"
        required: false
        default: "4CA2D5"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependency
        run: python -m pip install -r pipeline/requirements.txt
      - name: Compile FTWG binary from repository navigation CSVs
        run: python pipeline/compile_ftwg_graph.py
      - name: Fetch real archive trace and validate corridor
        env:
          RUN_DATE: ${{ inputs.date || '2026-11-16' }}
          ICAO24: ${{ inputs.icao24 || '4CA2D5' }}
          AUTO_PICK: ${{ inputs.auto_pick_4ca && 'true' || 'false' }}
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/benchmark_run.log) 2>&1
          STAGE="workflow_initialization"
          on_failure() {
            rc=$?
            if [[ ! -s /tmp/benchmark_evidence.json ]]; then
              python - "$STAGE" "$rc" <<'PY'
import json, os, sys
path="/tmp/benchmark_evidence.json"
payload={"status":"failed","failure_stage":sys.argv[1],"workflow_exit_code":int(sys.argv[2]),
         "error_message":"Workflow failed before pipeline recorder produced detailed evidence"}
with open(path,"w",encoding="utf-8") as f:
    json.dump(payload,f,indent=2); f.write("\\n"); f.flush(); os.fsync(f.fileno())
PY
            fi
          }
          trap on_failure ERR
          trap 'rm -f /tmp/archive.aa /tmp/archive.ab /tmp/benchmark_trace.raw' EXIT
          STAGE="archive_release_lookup"
          if [[ "$AUTO_PICK" == "true" ]]; then
            STAGE="pipeline_execution"
            python pipeline/build_corridors.py --mode benchmark --date "$RUN_DATE" --auto-pick-4ca --output /tmp/benchmark_result.json --evidence-out /tmp/benchmark_evidence.json
          else
            HEX="$(echo "$ICAO24" | tr '[:upper:]' '[:lower:]')"
            YEAR="$(date -u -d "$RUN_DATE" +%Y)"
            TAG="v$(date -u -d "$RUN_DATE" +%Y.%m.%d)-planes-readsb-prod-0"
            RELEASE_JSON="$(curl -fsSL "https://api.github.com/repos/adsblol/globe_history_$YEAR/releases/tags/$TAG")"
            URL_AA="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".tar.aa")) | .browser_download_url' | head -n1)"
            URL_AB="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".tar.ab")) | .browser_download_url' | head -n1)"
            if [[ -z "$URL_AA" || -z "$URL_AB" || "$URL_AA" == "null" || "$URL_AB" == "null" ]]; then
              echo "Expected split archive assets .tar.aa and .tar.ab not found for $TAG" >&2
              exit 1
            fi
            STAGE="archive_download"
            echo "Downloading split archive parts concurrently"
            curl -fL --retry 3 --retry-delay 2 -o /tmp/archive.aa "$URL_AA" &
            PID_AA=$!
            curl -fL --retry 3 --retry-delay 2 -o /tmp/archive.ab "$URL_AB" &
            PID_AB=$!
            wait "$PID_AA"
            wait "$PID_AB"
            STAGE="archive_extraction"
            echo "Extracting target trace_full_$HEX.json"
            set +o pipefail
            cat /tmp/archive.aa /tmp/archive.ab | tar -xOf - --wildcards --occurrence=1 "*trace_full_$HEX.json*" > /tmp/benchmark_trace.raw
            TAR_STATUS=$?
            set -o pipefail
            if [[ "$TAR_STATUS" -ne 0 ]]; then echo "tar extraction failed (exit $TAR_STATUS)" >&2; exit "$TAR_STATUS"; fi
            test -s /tmp/benchmark_trace.raw
            rm -f /tmp/archive.aa /tmp/archive.ab
            STAGE="pipeline_execution"
            python pipeline/build_corridors.py --mode benchmark --date "$RUN_DATE" --icao24 "$ICAO24" --trace-file /tmp/benchmark_trace.raw --output /tmp/benchmark_result.json --evidence-out /tmp/benchmark_evidence.json
          fi
      - name: Upload benchmark evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            /tmp/benchmark_evidence.json
            /tmp/benchmark_run.log
          if-no-files-found: ignore
          retention-days: 14
