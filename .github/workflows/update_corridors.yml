name: ADS-B corridor benchmark (real archive)

on:
  push:
    branches: [feature/adsb-route-learning]
    paths:
      - "pipeline/**"
      - "scripts/adsb_learning/**"
      - "tests/test_adsb_corridor_builder.py"
      - ".github/workflows/update_corridors.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC archive date (YYYY-MM-DD)"
        required: true
        default: "2026-11-13"
        type: string
      icao24:
        description: "Six-character benchmark ICAO24 hex"
        required: true
        default: "440C1B"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependency
        run: python -m pip install -r pipeline/requirements.txt
      - name: Compile FTWG binary from repository navigation CSVs
        run: python pipeline/compile_ftwg_graph.py
      - name: Fetch real archive trace and validate corridor
        env:
          RUN_DATE: ${{ inputs.date || '2026-11-13' }}
          ICAO24: ${{ inputs.icao24 || '440C1B' }}
        run: |
          set -euo pipefail
          python pipeline/build_corridors.py --mode benchmark --date "$RUN_DATE" --icao24 "$ICAO24" --output /tmp/benchmark_evidence.json
      - name: Upload validated anonymised evidence
        uses: actions/upload-artifact@v4
        with:
          name: adsb-corridor-benchmark
          path: /tmp/benchmark_evidence.json
          if-no-files-found: error
          retention-days: 14
