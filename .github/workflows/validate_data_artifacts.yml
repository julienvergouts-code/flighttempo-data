name: Validate FlightTempo Data Artifacts

on:
  push:
    branches: [main]
    paths:
      - "**/*manifest*.json"
      - "**/*meta*.json"
      - "**/*.csv"
      - "**/*.bin"
      - ".github/workflows/**"
      - "scripts/**"

  pull_request:
    branches: [main]
    paths:
      - "**/*manifest*.json"
      - "**/*meta*.json"
      - "**/*.csv"
      - "**/*.bin"
      - ".github/workflows/**"
      - "scripts/**"

  workflow_dispatch:
    inputs:
      reason:
        description: "Optional context for this validation run"
        required: false
        type: string
        default: "manual-validation"

permissions:
  contents: read

jobs:
  validate-ofma-vfr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show validation context
        run: echo "Validation reason: ${{ inputs.reason || 'triggered automatically' }}"
      - name: Validate OFMA CSV, provenance, and manifest integrity
        run: python scripts/validate_vfr_data_artifacts.py
