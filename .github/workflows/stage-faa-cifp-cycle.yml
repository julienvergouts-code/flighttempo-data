name: Stage newly published FAA CIFP cycle

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_faa_cifp_currentness.py"
      - "scripts/stage_faa_cifp_archive.py"
      - "scripts/audit_faa_cifp_archive.py"
      - "scripts/parse_faa_cifp_procedures.py"
      - "tests/test_faa_cifp_procedure_parser.py"
      - "tests/test_faa_cifp_archive_audit.py"
      - "tests/test_faa_cifp_currentness.py"
      - "tests/test_easa_airspace_coverage.py"
      - ".github/workflows/stage-faa-cifp-cycle.yml"
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faa-cifp-staging
  cancel-in-progress: false

jobs:
  stage-new-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check FAA publication cycle
        run: python scripts/check_faa_cifp_currentness.py
        continue-on-error: true
      - name: Run FAA CIFP and EASA geometry regression tests
        run: |
          python -m unittest discover -s tests -p 'test_faa_cifp*.py' -v
          python -m unittest discover -s tests -p 'test_easa_airspace_coverage.py' -v
      - name: Download and integrity-check new published CIFP archive
        run: python scripts/stage_faa_cifp_archive.py
      - name: Audit staged CIFP archive structure (report only)
        run: |
          archive="$(find /tmp/faa-cifp-update -maxdepth 1 -name 'CIFP_*.zip' -print -quit)"
          test -n "$archive"
          python scripts/audit_faa_cifp_archive.py "$archive" --output /tmp/faa-cifp-update/cifp-structure-audit.json
      - name: Extract official FAACIFP18 text member to staging
        run: |
          archive="$(find /tmp/faa-cifp-update -maxdepth 1 -name 'CIFP_*.zip' -print -quit)"
          python - "$archive" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive = Path(sys.argv[1])
          staged = Path("/tmp/faa-cifp-update/FAACIFP18")
          with zipfile.ZipFile(archive) as cifp:
              if "FAACIFP18" not in cifp.namelist():
                  raise SystemExit("FAA archive lacks expected FAACIFP18 data file")
              data = cifp.read("FAACIFP18")
          data.decode("ascii")
          staged.write_bytes(data)
          print(f"Extracted FAACIFP18 staging file: {len(data)} bytes")
          PY
      - name: Parse procedure headers into non-publishable staging records
        run: |
          archive="$(find /tmp/faa-cifp-update -maxdepth 1 -name 'CIFP_*.zip' -print -quit)"
          python scripts/parse_faa_cifp_procedures.py /tmp/faa-cifp-update/FAACIFP18 --source-archive "$(basename "$archive")" --output-dir /tmp/faa-cifp-update/parsed-staging
      - name: Upload staged archive and metadata
        uses: actions/upload-artifact@v4
        with:
          name: faa-cifp-staged-${{ github.run_id }}
          path: /tmp/faa-cifp-update/
          if-no-files-found: error
          retention-days: 14
