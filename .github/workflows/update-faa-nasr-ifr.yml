name: Update FAA NASR IFR Reference Data

# Imports US fixes, navaids and airway segments from the FAA 28-day NASR
# subscription (US Government public-domain data). The importer selects the
# newest cycle whose effective date has passed. It runs daily just after 00:00
# UTC (idempotent: nothing changes unless a new cycle took effect), so the data
# switches at the cycle boundary and downloads are not left without a cycle.
on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/fetch_faa_nasr_ifr.py'
      - 'scripts/register_faa_nasr_ifr_manifest.py'
      - '.github/workflows/update-faa-nasr-ifr.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Force a NASR cycle effective date (YYYY-MM-DD). Leave empty for the latest effective cycle.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: flighttempo-shared-manifest-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run unit tests for the importer
        run: python -m unittest tests.test_fetch_faa_nasr_ifr tests.test_register_faa_nasr_ifr_manifest -v
      - name: Import FAA NASR fixes, navaids and airway segments
        env:
          NASR_CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          if [ -n "$NASR_CYCLE" ]; then
            python pipeline/fetch_faa_nasr_ifr.py --cycle "$NASR_CYCLE"
          else
            python pipeline/fetch_faa_nasr_ifr.py
          fi
      - name: Register datasets in navigation manifest
        run: python scripts/register_faa_nasr_ifr_manifest.py
      - name: Enforce commercial-rights and cycle gate
        run: python scripts/enforce_app_manifest_rights.py
      - name: Validate every downloadable CSV in the app manifest
        run: python scripts/validate_navigation_csvs.py --manifest navigation_manifest.json
      - name: Commit changed datasets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation/faa_nasr navigation_manifest.json
          if git diff --cached --quiet; then
            echo "No FAA NASR IFR data changes."
          else
            git commit -m "chore(navdata): update FAA NASR IFR reference data [skip ci]"
            for attempt in 1 2 3; do
              git fetch -q origin main
              if git rebase origin/main; then
                git push origin HEAD:main && exit 0
              else
                git rebase --abort
                git reset -q --hard origin/main
                python pipeline/fetch_faa_nasr_ifr.py
                python scripts/register_faa_nasr_ifr_manifest.py
                python scripts/enforce_app_manifest_rights.py
                git add navigation/faa_nasr navigation_manifest.json
                git commit -q -m "chore(navdata): update FAA NASR IFR reference data [skip ci]" || exit 0
              fi
            done
            echo "Could not push after 3 attempts" >&2
            exit 1
          fi
