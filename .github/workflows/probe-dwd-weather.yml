name: Probe DWD aviation weather WFS metadata

on:
  push:
    branches: [main]
    paths:
      - 'weather/probe_dwd_wfs.py'
      - '.github/workflows/probe-dwd-weather.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flighttempo-dwd-weather-probe
  cancel-in-progress: false

jobs:
  probe-dwd-wfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe DWD WFS capabilities and aviation-weather layer schemas
        run: python3 weather/probe_dwd_wfs.py --output weather/dwd/wfs-probe-report.json
      - name: Publish metadata-only probe report
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/dwd/wfs-probe-report.json
          if git diff --cached --quiet; then
            echo "DWD WFS metadata report is unchanged."
            exit 0
          fi
          git commit -m "chore(weather): refresh DWD WFS metadata report [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
