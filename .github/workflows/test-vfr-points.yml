name: Test VFR Reporting Points Pipeline
on:
  pull_request:
    paths:
      - 'pipeline/fetch_vfr_points.py'
      - 'tests/test_fetch_vfr_points.py'
      - '.github/workflows/test-vfr-points.yml'
      - '.github/workflows/update-vfr-points.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest requests
      - run: python -m unittest discover -s tests -p 'test_fetch_vfr_points.py' -v
