name: Audit OFMX inventory tool

on:
  pull_request:
    paths:
      - "scripts/audit_ofmx_features.py"
      - "tests/test_audit_ofmx_features.py"
      - ".github/workflows/test-ofmx-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit_ofmx_features.py"
      - "tests/test_audit_ofmx_features.py"
      - ".github/workflows/test-ofmx-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/audit_ofmx_features.py tests/test_audit_ofmx_features.py
      - name: Unit tests
        run: python -m unittest tests.test_audit_ofmx_features -v
