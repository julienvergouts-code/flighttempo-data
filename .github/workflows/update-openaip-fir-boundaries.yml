name: Update OpenAIP global FIR boundaries
# Re-run after FIR-code and active-FIR index updates

on:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-openaip-fir-boundaries.yml'
      - 'scripts/import_openaip_firs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openaip-fir-import
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate OpenAIP importer syntax
        run: python3 -m py_compile scripts/import_openaip_firs.py
      - name: Import worldwide OpenAIP FIR/UIR polygons
        run: python3 scripts/import_openaip_firs.py
      - name: Add FIR boundaries and airspace filter to app manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("navigation_manifest.json")
          m = json.loads(p.read_text())
          datasets = [d for d in m.get("datasets", []) if d.get("id") not in {"openaip_fir_boundaries", "airspace_filter"}]
          for dataset_id, rel, provider, purpose in [
              ("openaip_fir_boundaries", "navigation/airspace/openaip_fir_boundaries.geojson", "OpenAIP", "development_fir_uiR_geometry_reference"),
              ("airspace_filter", "airspace/airspace_filter.json", "EASA and OpenAIP", "route_preview_advisory_filter_only"),
          ]:
              raw = Path(rel).read_bytes()
              obj = json.loads(raw)
              count = len(obj.get("features", [])) if dataset_id == "openaip_fir_boundaries" else len(obj.get("activeAdvisories", []))
              datasets.append({
                  "id": dataset_id, "path": rel,
                  "downloadUrl": "https://raw.githubusercontent.com/julienvergouts-code/flighttempo-data/main/" + rel,
                  "available": True, "recordCount": count, "sizeBytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "sourceProvider": provider,
                  "license": "CC BY-NC 4.0" if dataset_id == "openaip_fir_boundaries" else "EASA source acknowledgement + OpenAIP CC BY-NC 4.0",
                  "licenseStatus": "CC_BY_NC_4.0_attribution_required_non_commercial_only" if dataset_id == "openaip_fir_boundaries" else "advisory_only",
                  "downloadPurpose": purpose, "operationallyAvailable": False,
                  "status": "development_reference_only"
              })
          m["datasets"] = datasets
          m.setdefault("capabilities", {})["firBoundaries"] = True
          m["capabilities"]["conflictZoneAdvisories"] = True
          m["capabilities"]["hardNoFlyFIRRestrictions"] = False
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY
      - name: Update root provenance catalogue
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("manifest.json")
          m = json.loads(p.read_text())
          raw = Path("navigation/airspace/openaip_fir_boundaries.geojson").read_bytes()
          m["generatedAtUtc"] = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
          ds = [d for d in m.get("datasets", []) if d.get("id") != "openaip-fir-boundaries"]
          ds.append({
              "id": "openaip-fir-boundaries",
              "path": "navigation/airspace/openaip_fir_boundaries.geojson",
              "source": "OpenAIP country airspace exports",
              "airacCycle": None, "effectiveDate": None, "expiryDate": None,
              "sha256": hashlib.sha256(raw).hexdigest(),
              "licenceStatus": "CC_BY_NC_4.0_attribution_required_non_commercial_only",
              "coverage": "Worldwide FIR/UIR polygons where published in OpenAIP country exports",
              "recordCount": len(json.loads(raw).get("features", []))
          })
          m["datasets"] = ds
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY
      - name: Refresh airspace filter provenance checksums
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          def record(path):
              raw = Path(path).read_bytes()
              return hashlib.sha256(raw).hexdigest(), len(raw)
          root_path = Path("manifest.json")
          root = json.loads(root_path.read_text())
          root_files = {
              "airspace-filter": "airspace/airspace_filter.json",
              "easa-czibs": "airspace/advisories/easa_czibs.json",
              "easa-safety-directive-minsk": "airspace/advisories/easa_safety_directives.json",
          }
          for item in root.get("datasets", []):
              rel = root_files.get(item.get("id"))
              if rel:
                  item["sha256"], _ = record(rel)
                  if item.get("id") == "easa-safety-directive-minsk":
                      item["recordCount"] = len(json.loads(Path(rel).read_text()).get("records", []))
          root_path.write_text(json.dumps(root, indent=2) + "\n")
          air_path = Path("airspace/meta.json")
          air = json.loads(air_path.read_text())
          for item in air.get("files", []):
              if item.get("path") == "airspace_filter.json":
                  item["sha256"], item["sizeBytes"] = record("airspace/airspace_filter.json")
          air_path.write_text(json.dumps(air, indent=2) + "\n")
          meta_path = Path("airspace/advisories/meta.json")
          meta = json.loads(meta_path.read_text())
          if Path("airspace/advisories/easa_czibs.json").exists():
              meta["sha256"], _ = record("airspace/advisories/easa_czibs.json")
          for item in meta.get("files", []):
              rel = "airspace/advisories/" + item.get("path", "")
              if rel in {"airspace/advisories/easa_czibs.json", "airspace/advisories/easa_safety_directives.json"} and Path(rel).exists():
                  item["sha256"], item["sizeBytes"] = record(rel)
                  if rel.endswith("easa_safety_directives.json"):
                      item["recordCount"] = len(json.loads(Path(rel).read_text()).get("records", []))
          meta["safetyDirectiveCount"] = len(json.loads(Path("airspace/advisories/easa_safety_directives.json").read_text()).get("records", []))
          meta_path.write_text(json.dumps(meta, indent=2) + "\n")
          PY
      - name: Commit refreshed FIR boundary datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation/airspace airspace/airspace_filter.json navigation_manifest.json manifest.json airspace/meta.json airspace/advisories/meta.json
          git commit -m "data(airspace): refresh worldwide OpenAIP FIR boundaries" || echo "No FIR boundary changes"
          git pull --rebase origin main
          git push
