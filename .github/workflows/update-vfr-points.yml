name: Update FAA VFR Waypoints
on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/fetch_vfr_points.py'
      - '.github/workflows/update-vfr-points.yml'
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flighttempo-shared-manifest-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run FAA importer
        run: python pipeline/fetch_vfr_points.py
      - name: Register FAA VFR waypoints in navigation manifest
        run: python scripts/register_faa_vfr_points_manifest.py
      - name: Commit changed dataset and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vfr_points.csv data/vfr_points_meta.json navigation_manifest.json
          if git diff --cached --quiet; then
            echo "No VFR waypoint data changes."
          else
            git commit -m "Update FAA VFR waypoints and manifest"
            git push
          fi
