name: Update FAA VFR Reporting Points
on:
  push:
    branches:
      - main
    paths:
      - 'pipeline/fetch_vfr_points.py'
      - '.github/workflows/update-vfr-points.yml'
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flighttempo-shared-manifest-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run FAA importer
        run: python pipeline/fetch_vfr_points.py
      - name: Register VFR reporting points in navigation manifest
        run: python scripts/register_faa_vfr_points_manifest.py
      - name: Enforce commercial-rights and cycle gate after registration
        run: python scripts/enforce_app_manifest_rights.py
      - name: Validate every downloadable CSV in the app manifest
        run: python scripts/validate_navigation_csvs.py --manifest navigation_manifest.json
      - name: Commit changed dataset and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vfr_points.csv data/vfr_points_meta.json navigation_manifest.json
          if git diff --cached --quiet; then
            echo "No VFR reporting-point data changes."
          else
            git commit -m "Update FAA VFR reporting points and manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
