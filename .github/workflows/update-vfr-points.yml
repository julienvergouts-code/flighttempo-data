name: Update FAA VFR Reporting Points
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-vfr-points
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run FAA importer
        run: python pipeline/fetch_vfr_points.py
      - name: Commit changed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vfr_points.csv data/vfr_points_meta.json
          if git diff --cached --quiet; then
            echo "No VFR reporting-point data changes."
          else
            git commit -m "Update FAA VFR reporting points"
            git push
          fi
