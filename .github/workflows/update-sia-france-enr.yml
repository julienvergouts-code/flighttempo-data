name: Update France SIA fixes, navaids, airways and airspace

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  pull_request:
    paths:
      - "scripts/sia_enr_parse.py"
      - "scripts/import_sia_france_enr.py"
      - "scripts/register_sia_france_manifest.py"
      - "scripts/enforce_app_manifest_rights.py"
      - "tests/test_sia_enr_parse.py"
      - ".github/workflows/update-sia-france-enr.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('flighttempo-pr-{0}', github.workflow) || 'flighttempo-shared-manifest-updates' }}
  cancel-in-progress: false

jobs:
  import-sia-france-enr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the SIA parsers
        run: python -m unittest discover -s tests -p 'test_sia_enr_parse.py' -v
      - name: Import current SIA ENR data (skips cleanly when SIA is unreachable)
        run: python scripts/import_sia_france_enr.py
      - name: Register SIA France datasets
        run: python scripts/register_sia_france_manifest.py
      - name: Enforce commercial redistribution rights and cycle window
        run: python scripts/enforce_app_manifest_rights.py
      - name: Validate every downloadable CSV
        run: python scripts/validate_navigation_csvs.py --manifest navigation_manifest.json
      - name: Publish the validated data update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation/sia_france airspace/sia navigation_manifest.json
          if git diff --cached --quiet; then
            echo "No SIA France ENR changes."
            exit 0
          fi
          git commit -m "chore(navdata): update SIA France ENR fixes, navaids, airways and airspace [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
