name: Update Aviation Navigation & CIFP Data

on:
  # Runs daily at 04:15 UTC; the script automatically checks the current AIRAC cycle
  schedule:
    - cron: '15 4 * * *'
  # Allows you to trigger it immediately with 1 click in the "Actions" tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download & Build Real Navigation Datasets (OurAirports + FAA CIFP)
        run: python3 scripts/build_aviation_db.py

      - name: Validate Generated CSVs & Manifest
        run: |
          test -f navigation_manifest.json
          test -s navigation/navaids/navaids.csv
          test -s navigation/airline_routes/routes.dat
          test -s navigation/waypoints/waypoints.csv
          test -s navigation/airways/airways.csv
          echo "Validation passed:"
          cat navigation_manifest.json

      - name: Commit and Push Updated Datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation/ procedures/ navigation_manifest.json
          if git diff --staged --quiet; then
            echo "No navigation data changes to commit."
          else
            CYCLE=$(python3 -c "import json; print(json.load(open('navigation_manifest.json'))['airacCycle'])")
            git commit -m "chore(navdata): auto-update FAA CIFP & OurAirports datasets (AIRAC $CYCLE)"
            git push
          fi
