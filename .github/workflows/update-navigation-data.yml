name: Update Airports & Navigation Data

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-navigation-data.yml'
      - 'scripts/**'
      - 'navigation/**'
      - 'navigation_manifest.json'
      - 'app/src/main/assets/airports.csv'

permissions:
  contents: write

concurrency:
  group: flighttempo-navigation-update
  cancel-in-progress: false

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate aviation database
        run: python3 scripts/build_aviation_db.py

      - name: Verify generated datasets
        run: |
          set -euo pipefail
          git diff --check

          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          manifest = json.loads(Path("navigation_manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("schemaVersion") == 11, (
              f"Unexpected manifest schemaVersion: {manifest.get('schemaVersion')!r}; "
              "update this workflow when the builder schema changes."
          )

          capabilities = manifest.get("capabilities", {})
          for capability in ("airports", "runways", "navaids", "vor", "dme", "ndb"):
              assert capabilities.get(capability) is True, (
                  f"Required capability is not available: {capability}"
              )

          datasets = {
              "app/src/main/assets/airports.csv": {
                  "minimum": 1000,
                  "headers": {"icao", "country", "latitude", "longitude", "elevation_ft", "name"},
              },
              "navigation/runways/runways_parsed.csv": {
                  "minimum": 500,
                  "headers": {
                      "airport_icao", "runway_pair", "le_ident", "he_ident",
                      "le_heading_degT", "he_heading_degT", "length_ft",
                      "width_ft", "surface", "lighted",
                  },
              },
              "navigation/navaids/navaids.csv": {
                  "minimum": 1000,
                  "headers": {
                      "ident", "name", "type", "frequency_khz", "frequency_mhz",
                      "dme_frequency_khz", "dme_frequency_mhz", "dme_channel",
                      "latitude_deg", "longitude_deg", "elevation_ft",
                      "dme_latitude_deg", "dme_longitude_deg", "dme_elevation_ft",
                      "iso_country", "slaved_variation_deg", "magnetic_variation_deg",
                      "usage_type", "power", "associated_airport",
                  },
              },
          }

          for filename, spec in datasets.items():
              path = Path(filename)
              assert path.is_file() and path.stat().st_size > 0, f"Missing/empty dataset: {filename}"

              with path.open(encoding="utf-8", newline="") as stream:
                  reader = csv.DictReader(stream)
                  headers = set(reader.fieldnames or [])
                  missing = spec["headers"] - headers
                  assert not missing, f"{filename} missing columns: {sorted(missing)}"

                  count = 0
                  type_counts = Counter()
                  for row in reader:
                      count += 1
                      if filename.endswith("navaids.csv"):
                          nav_type = (row.get("type") or "").strip().upper()
                          assert nav_type, f"Blank navaid type at record {count}"
                          type_counts[nav_type] += 1

                          lat = float(row["latitude_deg"])
                          lon = float(row["longitude_deg"])
                          assert -90 <= lat <= 90, f"Invalid navaid latitude at record {count}: {lat}"
                          assert -180 <= lon <= 180, f"Invalid navaid longitude at record {count}: {lon}"

                      elif filename.endswith("airports.csv"):
                          lat = float(row["latitude"])
                          lon = float(row["longitude"])
                          assert -90 <= lat <= 90, f"Invalid airport latitude at record {count}: {lat}"
                          assert -180 <= lon <= 180, f"Invalid airport longitude at record {count}: {lon}"

                      elif filename.endswith("runways_parsed.csv"):
                          assert (row.get("airport_icao") or "").strip(), (
                              f"Blank runway airport identifier at record {count}"
                          )
                          for heading_field in ("le_heading_degT", "he_heading_degT"):
                              raw = (row.get(heading_field) or "").strip()
                              if raw:
                                  heading = float(raw)
                                  assert 0 <= heading <= 360, (
                                      f"Invalid {heading_field} at record {count}: {heading}"
                                  )

              assert count >= spec["minimum"], (
                  f"Too few records in {filename}: {count} < {spec['minimum']}"
              )
              print(f"{filename}: {count} records; headers and semantic checks passed")

              if filename.endswith("navaids.csv"):
                  declared = manifest.get("navaidTypeCounts", {})
                  assert dict(sorted(type_counts.items())) == dict(sorted(declared.items())), (
                      "Navaid type counts do not match navigation_manifest.json"
                  )

          navaid_types = manifest.get("navaidTypeCounts", {})
          vor_count = sum(navaid_types.get(t, 0) for t in ("VOR", "VOR-DME", "VORTAC"))
          dme_count = sum(
              navaid_types.get(t, 0)
              for t in ("DME", "NDB-DME", "TACAN", "VOR-DME", "VORTAC")
          )
          ndb_count = sum(navaid_types.get(t, 0) for t in ("NDB", "NDB-DME"))
          assert vor_count > 0, "No VOR-family navaids found"
          assert dme_count > 0, "No DME-capable navaids found"
          assert ndb_count > 0, "No NDB-family navaids found"

          print(
              "Navaid semantic checks passed: "
              f"VOR-family={vor_count}, DME-capable={dme_count}, NDB-family={ndb_count}"
          )
          print("Manifest and generated datasets validated.")

      - name: Commit updated datasets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            navigation/ \
            app/src/main/assets/airports.csv \
            navigation_manifest.json

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi

          git commit -m "chore(navdata): update verified aviation datasets [skip ci]"
          git push origin HEAD:main
