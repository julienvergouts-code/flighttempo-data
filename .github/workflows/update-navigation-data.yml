name: Update Airports & Navigation Data

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'navigation/**'
      - 'procedures/**'
      - 'airports/**'
      - '.github/workflows/update-navigation-data.yml'
      - '!scripts/build_global_airline_directory.py'
      - '!tests/test_global_airline_directory.py'
      - 'DATA_AUTOMATION.md'
      - '!navigation/airspace/**'
      - '!navigation/graph/**'
      - '!navigation/sources/flightgear/**'
      - '!navigation/waypoints/flightgear_fixes.csv'
      - '!navigation/navaids/flightgear_navaids.csv'
      - '!navigation/airways/flightgear_airway_segments.csv'
      - '!navigation/README.md'
      - '!airspace/**'
      - '!scripts/import_openaip_firs.py'
      - '!scripts/import_easa_czibs.py'
      - '!scripts/import_faa_prn.py'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'navigation/**'
      - 'procedures/**'
      - 'airports/**'
      - '.github/workflows/update-navigation-data.yml'
      - '!scripts/build_global_airline_directory.py'
      - '!tests/test_global_airline_directory.py'
      - 'DATA_AUTOMATION.md'
      - '!navigation/airspace/**'
      - '!navigation/graph/**'
      - '!navigation/sources/flightgear/**'
      - '!navigation/waypoints/flightgear_fixes.csv'
      - '!navigation/navaids/flightgear_navaids.csv'
      - '!navigation/airways/flightgear_airway_segments.csv'
      - '!airspace/**'
      - '!scripts/import_openaip_firs.py'
      - '!scripts/import_easa_czibs.py'
      - '!scripts/import_faa_prn.py'
      - '!scripts/import_xplane_navdata.py'
      - '!scripts/build_world_corridor_graph.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('flighttempo-pr-{0}', github.workflow) || 'flighttempo-shared-manifest-updates' }}
  cancel-in-progress: false

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      # Queued manifest jobs must use latest main; the OurAirports builder preserves external datasets.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit-test fixture dependency
        run: python3 -m pip install -r requirements-aerosors.txt
      - name: Reconcile EASA reference snapshot checksum before repository tests
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path("navigation_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          item = next(d for d in manifest["datasets"] if d.get("id") == "easa_safety_directives")
          path = Path(item["path"])
          raw = path.read_bytes()
          data = json.loads(raw)
          item["sha256"] = hashlib.sha256(raw).hexdigest()
          item["sizeBytes"] = len(raw)
          item["recordCount"] = len(data.get("records", []))
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Reconciled EASA directives reference: {item['recordCount']} records, {item['sizeBytes']} bytes, sha256={item['sha256']}")
          PY
      - name: Enforce app manifest redistribution rights before tests
        run: python3 scripts/enforce_app_manifest_rights.py
      - name: Run IFR importer unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install French SIA procedure PDF parser
        run: python3 -m pip install -r requirements-sia-procedures.txt
      - name: Install FAA PRN PDF parser
        run: python3 -m pip install 'pypdf>=5,<7'
      - name: Smoke-test extraction against current official SIA SID and STAR tables
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_URL="https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_29_OCT_2026/FRANCE/AIRAC-2026-10-29/html/eAIP/Cartes"
          mkdir -p /tmp/flighttempo-sia-pdfs
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE_URL/LFPG/AD_2_LFPG_DATA_SID_RWY26L-26R_RNAV_CODE_02.pdf" \
            -o /tmp/flighttempo-sia-pdfs/AD_2_LFPG_DATA_SID_RWY26L-26R_RNAV_CODE_02.pdf
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE_URL/LFPG/AD_2_LFPG_DATA_STAR_RWY26L_RNAV_CODE_02.pdf" \
            -o /tmp/flighttempo-sia-pdfs/AD_2_LFPG_DATA_STAR_RWY26L_RNAV_CODE_02.pdf
          python3 scripts/import_sia_eaip_procedures.py \
            --pdf-dir /tmp/flighttempo-sia-pdfs \
            --airac-effective-date 2026-10-29 \
            --source-base-url "$BASE_URL" \
            --output /tmp/flighttempo-sia-pilot.csv \
            --manifest /tmp/flighttempo-sia-pilot-manifest.json
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          rows = list(csv.DictReader(Path("/tmp/flighttempo-sia-pilot.csv").open(encoding="utf-8", newline="")))
          assert rows, "SIA smoke test extracted no procedure legs"
          counts = {kind: sum(row["procedure_type"] == kind for row in rows) for kind in ("SID", "STAR")}
          assert all(count > 0 for count in counts.values()), f"SID/STAR table extraction failed: {counts}"
          assert all(row["airport_icao"] == "LFPG" for row in rows)
          assert all(row["path_terminator"] for row in rows)
          manifest = json.loads(Path("/tmp/flighttempo-sia-pilot-manifest.json").read_text())
          assert manifest["operationallyAvailable"] is False
          print(f"SIA LFPG procedure table smoke test passed: {counts}; total={len(rows)}")
          PY
      - name: Build OurAirports reference datasets
        run: python3 scripts/build_aviation_db.py
      - name: Build Global Overflight & VFR Geography Packs
        run: python3 scripts/build_geography_pack.py
      - name: Import optional global IFR fixes and navaids
        run: |
          python3 scripts/import_xplane_navdata.py \
            --source-dir navigation/sources/flightgear \
            --manifest navigation_manifest.json \
            --optional --include-airways
      - name: Record legacy global IFR facility types and source provenance
        run: |
          python3 - <<'PY'
          import csv, hashlib, json
          from datetime import datetime, timezone
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          import_path = root / "navigation/sources/flightgear/import_metadata.json"
          nav_path = root / "navigation_manifest.json"
          root_manifest_path = root / "manifest.json"
          if import_path.is_file():
              source = json.loads(import_path.read_text())
              nav = json.loads(nav_path.read_text())
              counts = source.setdefault("counts", {})
              navaid_csv = root / "navigation/navaids/flightgear_navaids.csv"
              facility_counts = Counter()
              if navaid_csv.is_file():
                  with navaid_csv.open(encoding="utf-8", newline="") as handle:
                      for row in csv.DictReader(handle):
                          facility_counts[row.get("facility_type", "UNKNOWN") or "UNKNOWN"] += 1
              counts["facilityTypeCounts"] = dict(sorted(facility_counts.items()))
              counts["ilsFacilityCount"] = sum(v for k, v in facility_counts.items() if k.startswith("ILS_") or k == "LOCALIZER_LDA_SDF")
              counts["localizerCount"] = facility_counts.get("ILS_LOCALIZER", 0) + facility_counts.get("LOCALIZER_LDA_SDF", 0)
              counts["glideslopeCount"] = facility_counts.get("ILS_GLIDESLOPE", 0)
              counts["markerBeaconCount"] = sum(facility_counts.get(k, 0) for k in ("ILS_OUTER_MARKER", "ILS_MIDDLE_MARKER", "ILS_INNER_MARKER"))
              counts["dmeFacilityCount"] = facility_counts.get("DME_PAIRED", 0) + facility_counts.get("DME_STANDALONE", 0)
              import_path.write_text(json.dumps(source, indent=2) + "\n")

              datasets = {d.get("path"): d for d in nav.get("datasets", [])}
              def dataset(path):
                  if path not in datasets:
                      raise RuntimeError(f"Missing app manifest dataset: {path}")
                  return datasets[path]
              fixes = dataset("navigation/waypoints/flightgear_fixes.csv")
              navaids = dataset("navigation/navaids/flightgear_navaids.csv")
              airways = dataset("navigation/airways/flightgear_airway_segments.csv")
              cycle = source.get("dataCycle")
              provider = source.get("provider", "Legacy X-Plane navigation data mirror")
              license_name = source.get("license", "GPL-3.0")

              nav.setdefault("statistics", {})["flightgearIlsFacilities"] = counts["ilsFacilityCount"]
              nav["statistics"]["flightgearLocalizerFacilities"] = counts["localizerCount"]
              nav["statistics"]["flightgearGlideslopeFacilities"] = counts["glideslopeCount"]
              nav["statistics"]["flightgearMarkerBeacons"] = counts["markerBeaconCount"]
              nav["statistics"]["flightgearDmeFacilities"] = counts["dmeFacilityCount"]
              nav.setdefault("capabilities", {})["legacyGlobalFixes"] = fixes.get("recordCount", 0) > 0
              nav["capabilities"]["legacyGlobalNavaids"] = navaids.get("recordCount", 0) > 0
              nav["capabilities"]["legacyGlobalAirways"] = airways.get("recordCount", 0) > 0
              nav["capabilities"]["legacyGlobalIlsFacilities"] = counts["ilsFacilityCount"] > 0
              nav["capabilities"]["worldCorridorGraph"] = (root / "navigation/graph/world_corridor_graph.bin").is_file()

              (root / "navigation/waypoints/meta.json").write_text(json.dumps({
                  "source": provider, "sourceUrl": source.get("sourceUrl"),
                  "airacCycle": None, "sourceCycleToken": cycle,
                  "effectiveDate": None, "expiryDate": None,
                  "sha256": fixes.get("sha256"),
                  "licenceStatus": "GPL-3.0_legacy_stale_personal_development_reference",
                  "licenseName": license_name, "recordCount": fixes.get("recordCount"),
                  "coverage": "Worldwide legacy IFR fixes; stale cycle; not operational",
                  "files": [{"path": "flightgear_fixes.csv", "sha256": fixes.get("sha256"), "sizeBytes": fixes.get("sizeBytes"), "recordCount": fixes.get("recordCount")}],
                  "notes": "Source cycle is preserved exactly and is not claimed to be a current AIRAC."
              }, indent=2) + "\n")

              (root / "navigation/airways/meta.json").write_text(json.dumps({
                  "source": provider, "sourceUrl": source.get("sourceUrl"),
                  "airacCycle": None, "sourceCycleToken": cycle,
                  "effectiveDate": None, "expiryDate": None,
                  "sha256": airways.get("sha256"),
                  "licenceStatus": "GPL-3.0_legacy_stale_personal_development_reference",
                  "licenseName": license_name, "recordCount": airways.get("recordCount"),
                  "lowAirwaySegments": counts.get("lowAirwaySegments"),
                  "highAirwaySegments": counts.get("highAirwaySegments"),
                  "coverage": "Worldwide legacy airway segments; stale cycle; not operational",
                  "files": [{"path": "flightgear_airway_segments.csv", "sha256": airways.get("sha256"), "sizeBytes": airways.get("sizeBytes"), "recordCount": airways.get("recordCount")}],
                  "notes": "Low/high airway classification is retained from the source AWY640 level field."
              }, indent=2) + "\n")

              navaid_meta_path = root / "navigation/navaids/meta.json"
              navaid_meta = json.loads(navaid_meta_path.read_text())
              navaid_meta.update({
                  "source": "Mixed sources; per-file source and licence apply",
                  "airacCycle": None, "sourceCycleToken": cycle,
                  "sha256": None,
                  "licenceStatus": "mixed_per_file_CC0_and_GPL3",
                  "files": [
                      {"path": "navaids.csv", "sha256": datasets["navigation/navaids/navaids.csv"].get("sha256"), "sizeBytes": datasets["navigation/navaids/navaids.csv"].get("sizeBytes"), "recordCount": datasets["navigation/navaids/navaids.csv"].get("recordCount"), "source": "OurAirports", "license": "CC0 / Public Domain"},
                      {"path": "flightgear_navaids.csv", "sha256": navaids.get("sha256"), "sizeBytes": navaids.get("sizeBytes"), "recordCount": navaids.get("recordCount"), "source": provider, "sourceCycleToken": cycle, "license": license_name}
                  ]
              })
              navaid_meta_path.write_text(json.dumps(navaid_meta, indent=2) + "\n")

              source_meta = {
                  "source": provider, "sourceUrl": source.get("sourceUrl"),
                  "airacCycle": None, "sourceCycleToken": cycle,
                  "effectiveDate": None, "expiryDate": None,
                  "sha256": None, "licenceStatus": "GPL-3.0_legacy_stale_personal_development_reference",
                  "licenseName": license_name, "recordCount": counts.get("fixes", 0) + counts.get("navaids", 0) + counts.get("airwaySegments", 0),
                  "sourceFiles": source.get("files", []),
                  "files": [
                      {"path": "earth_fix.dat", "sha256": source.get("files", [{}])[0].get("sha256"), "sizeBytes": source.get("files", [{}])[0].get("sizeBytes")},
                      {"path": "earth_nav.dat", "sha256": source.get("files", [{}, {}])[1].get("sha256"), "sizeBytes": source.get("files", [{}, {}])[1].get("sizeBytes")},
                      {"path": "earth_awy.dat", "sha256": source.get("files", [{}, {}, {}])[2].get("sha256"), "sizeBytes": source.get("files", [{}, {}, {}])[2].get("sizeBytes")}
                  ],
                  "counts": counts,
                  "notes": "Legacy cycle 2012.08. Development/reference use only; never represent as current AIRAC or operational data."
              }
              (root / "navigation/sources/flightgear/meta.json").write_text(json.dumps(source_meta, indent=2) + "\n")

              root_manifest = json.loads(root_manifest_path.read_text())
              root_datasets = [d for d in root_manifest.get("datasets", []) if d.get("id") not in {"legacy-global-ifr-fixes", "legacy-global-ifr-navaids", "legacy-global-airways"}]
              for dataset_id, item, coverage in (
                  ("legacy-global-ifr-fixes", fixes, "Worldwide legacy IFR fixes"),
                  ("legacy-global-ifr-navaids", navaids, "Worldwide legacy navaids including ILS facilities"),
                  ("legacy-global-airways", airways, "Worldwide legacy low/high airway segments")
              ):
                  root_datasets.append({
                      "id": dataset_id, "path": item["path"], "source": provider,
                      "airacCycle": None, "sourceCycleToken": cycle,
                      "effectiveDate": None, "expiryDate": None,
                      "sha256": item.get("sha256"),
                      "licenceStatus": "GPL-3.0_legacy_stale_personal_development_reference",
                      "coverage": coverage, "recordCount": item.get("recordCount")
                  })
              root_manifest["datasets"] = root_datasets
              root_manifest["generatedAtUtc"] = datetime.now(timezone.utc).isoformat()
              root_manifest_path.write_text(json.dumps(root_manifest, indent=2) + "\n")
              nav_path.write_text(json.dumps(nav, indent=2) + "\n")
          PY
      - name: Build world corridor graph
        run: python3 scripts/build_world_corridor_graph.py
      - name: Refresh FAA PRN reference index (not live NOTAM status)
        run: python3 scripts/import_faa_prn.py
      - name: Register graph and airspace datasets in manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('navigation_manifest.json')
          m = json.loads(p.read_text())
          datasets = [d for d in m.get('datasets', []) if d.get('id') not in {'world_corridor_graph', 'easa_czibs', 'easa_safety_directives', 'airspace_filter', 'route_policy', 'openaip_fir_boundaries', 'faa_prn_notams', 'aerosors_vor_ndb', 'aerosors_ils', 'aerosors_ge_navaids', 'aerosors_ge_airports'}]
          items = [
              ('world_corridor_graph', 'navigation/graph/world_corridor_graph.bin', 'legacy_global_graph_test_only', 'GPL-3.0'),
              ('easa_czibs', 'airspace/advisories/easa_czibs.json', 'advisory_reference_not_operational', 'EASA source acknowledgement'),
              ('easa_safety_directives', 'airspace/advisories/easa_safety_directives.json', 'operator_scope_reference_only', 'EASA source acknowledgement'),
              ('route_policy', 'airspace/route_policy.json', 'route_preview_policy', 'FlightTempo original configuration'),
              ('faa_prn_notams', 'airspace/faa_prn_notams.json', 'reference_only_currentness_unverified', 'FAA public reference; currentness unverified'),
          ]
          for dataset_id, rel, status, license_name in items:
              f = Path(rel)
              if not f.is_file():
                  continue
              raw = f.read_bytes()
              obj = json.loads(raw) if f.suffix == '.json' else None
              if dataset_id == 'world_corridor_graph':
                  meta = json.loads(Path('navigation/graph/meta.json').read_text())
                  count = meta['edgeCount']
              elif dataset_id in {'easa_czibs', 'easa_safety_directives'}:
                  count = len(obj.get('records', []))
              elif dataset_id == 'route_policy':
                  count = 1
              elif dataset_id == 'faa_prn_notams':
                  count = len(obj.get('records', []))
              datasets.append({
                  'id': dataset_id, 'path': rel,
                  'downloadUrl': 'https://raw.githubusercontent.com/julienvergouts-code/flighttempo-data/main/' + rel,
                  'available': True, 'recordCount': count, 'sizeBytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(), 'status': status,
                  'license': license_name, 'operationallyAvailable': False
              })
          m['datasets'] = datasets
          m.setdefault('capabilities', {})['worldCorridorGraph'] = Path('navigation/graph/world_corridor_graph.bin').is_file()
          m['capabilities']['conflictZoneAdvisories'] = Path('airspace/advisories/easa_czibs.json').is_file()
          m['capabilities']['firBoundaries'] = False
          m['capabilities']['faaPrnReferences'] = Path('airspace/faa_prn_notams.json').is_file()
          m['capabilities']['airspaceFilterAdvisoryOnly'] = False
          m['capabilities']['faaLiveNotamCurrentnessVerified'] = False
          m['capabilities']['hardNoFlyFIRRestrictions'] = False
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY
      - name: Enrich airport reference with OurAirports runway and elevation data
        run: python3 scripts/enrich_airport_reference.py
      - name: Enforce app manifest redistribution rights
        run: python3 scripts/enforce_app_manifest_rights.py
      - name: Check current FAA CIFP publication and packaged cycle
        run: python3 scripts/check_faa_cifp_currentness.py
      - name: Register FAA VFR reporting points in navigation manifest
        run: python3 scripts/register_faa_vfr_points_manifest.py
      - name: Validate every downloadable CSV in the app manifest
        run: python3 scripts/validate_navigation_csvs.py --manifest navigation_manifest.json
      - name: Verify generated datasets and manifest
        run: |
          set -e
          test -s airports/airports.csv
          test -s airlines/airlines.csv
          test -s airlines/route_rules.csv
          test -s navigation/airports/ourairports_airports.csv
          test -s navigation/navaids/navaids.csv
          test -s navigation/runways/runways_parsed.csv
          test -s navigation_manifest.json
          test -s navigation/geography/world_geography.json.gz
          test -s navigation/geography/world_hydrography.json.gz
          test -s navigation/geography/meta.json
          python3 - <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("navigation_manifest.json").read_text())
          # The Android landmark loader requires a top-level JSON array.
          with gzip.open("navigation/geography/world_geography.json.gz", "rt", encoding="utf-8") as handle:
              geography = json.load(handle)
          assert isinstance(geography, list), "World geography pack must remain a top-level JSON array"
          assert len(geography) >= 5000, f"Unexpectedly small global geography pack: {len(geography)}"
          for item in geography:
              assert item.get("name") and item.get("kind") in {"CITY", "PEAK", "ISLAND", "FEATURE"}
              assert -90 <= float(item["lat"]) <= 90 and -180 <= float(item["lon"]) <= 180
          with gzip.open("navigation/geography/world_hydrography.json.gz", "rt", encoding="utf-8") as handle:
              hydro = json.load(handle)
          assert set(hydro.get("layers", {})) == {"rivers", "lakes", "countryBorders"}
          assert all(hydro["layers"][name] for name in ("rivers", "lakes", "countryBorders"))
          geography_meta = json.loads(Path("navigation/geography/meta.json").read_text())
          assert geography_meta["sha256"] == hashlib.sha256(Path("navigation/geography/world_geography.json.gz").read_bytes()).hexdigest()
          assert geography_meta["hydrography"]["sha256"] == hashlib.sha256(Path("navigation/geography/world_hydrography.json.gz").read_bytes()).hexdigest()
          print(f"World geography pack: {len(geography):,} landmarks; hydrography layers: { {k: len(v) for k, v in hydro['layers'].items()} }")
          assert manifest["schemaVersion"] == 13, "Unexpected manifest schema version"
          expected = {
              "airports/airports.csv": 1000,
              "navigation/airports/ourairports_airports.csv": 1000,
              "navigation/navaids/navaids.csv": 1000,
              "navigation/runways/runways_parsed.csv": 500,
          }
          for relative, minimum in expected.items():
              path = Path(relative)
              with path.open(encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert len(rows) >= minimum, f"Too few records in {relative}: {len(rows)}"
              if relative.endswith("runways_parsed.csv"):
                  required = {"le_heading_degT", "he_heading_degT", "length_ft", "width_ft"}
                  assert required.issubset(rows[0].keys()), "Runway geometry columns missing"
              if relative.endswith("navaids.csv"):
                  required = {"frequency_khz", "dme_frequency_khz", "dme_latitude_deg",
                              "slaved_variation_deg", "usage_type"}
                  assert required.issubset(rows[0].keys()), "Navaid detail columns missing"
              print(f"{relative}: {len(rows)} records")
          for dataset in manifest.get("datasets", []):
              if not dataset.get("available"):
                  continue
              path = Path(dataset["path"])
              assert path.is_file(), f"Manifest points to missing file: {path}"
              assert path.stat().st_size == dataset["sizeBytes"], f"Size mismatch: {path}"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == dataset["sha256"]
              if path.suffix == ".bin":
                  meta = json.loads(path.with_name("meta.json").read_text(encoding="utf-8"))
                  count = meta["edgeCount"]
                  assert count == dataset["recordCount"], f"Graph edge count mismatch: {path}"
                  assert meta["sha256"] == digest, f"Graph metadata checksum mismatch: {path}"
              elif path.suffix == ".geojson":
                  obj = json.loads(path.read_text(encoding="utf-8"))
                  count = len(obj.get("features", []))
                  assert count == dataset["recordCount"], f"GeoJSON feature count mismatch: {path}"
              elif path.suffix == ".json":
                  obj = json.loads(path.read_text(encoding="utf-8"))
                  count = 1 if dataset.get("id") == "route_policy" else len(obj.get("records", obj.get("activeAdvisories", [])))
                  assert count == dataset["recordCount"], f"JSON record count mismatch: {path}"
              else:
                  with path.open(encoding="utf-8", newline="") as handle:
                      rows = [row for row in csv.reader(handle)
                              if row and not row[0].strip().lower().startswith(("sep=", "#version"))]
                      count = max(0, len(rows) - 1)
                  assert count == dataset["recordCount"], f"Record count mismatch: {path}"
              print(f"{dataset['id']}: {count} records; {path.stat().st_size} bytes")
          capabilities = manifest.get("capabilities", {})
          for capability in ("airports", "ourairportsAirports", "runways", "navaids", "vor", "dme", "ndb", "airlineProfiles", "rosterClassificationRules"):
              assert capabilities.get(capability) is True, f"Missing required capability: {capability}"
          for metric in ("airports", "runways", "navaids"):
              assert manifest.get("statistics", {}).get(metric, 0) > 0, f"Missing statistic: {metric}"
          profile = Path("airlines/airlines.csv").read_text(encoding="utf-8").splitlines()
          profile_lines = [line for line in profile if line.strip() and not line.startswith("sep=") and not line.startswith("#version")]
          assert profile_lines, "Airline profile catalogue missing"
          airline_header = next(csv.reader([profile_lines[0]], delimiter=";"))
          assert {"code", "displayName", "signOnMins", "iataCodes"}.issubset(set(airline_header)), "Airline profile schema mismatch"
          route_lines = [line for line in Path("airlines/route_rules.csv").read_text(encoding="utf-8").splitlines() if line.strip() and not line.startswith("#version")]
          assert route_lines and route_lines[0].split(",") == ["kind", "code"], "Route rules schema mismatch"
          print("Manifest, navigation datasets and airline profile packages validated.")
          PY
      - name: Commit updated datasets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            navigation/ \
            procedures/ \
            airspace/ \
            airports/airports.csv \
            airlines/airlines.csv \
            airlines/route_rules.csv \
            navigation_manifest.json \
            manifest.json
          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi
          git commit -m "chore(navdata): update verified aviation datasets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

