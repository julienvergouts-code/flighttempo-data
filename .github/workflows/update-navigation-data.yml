name: Update Airports & Navigation Data

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'navigation/**'
      - 'procedures/**'
      - '.github/workflows/update-navigation-data.yml'
      - 'navigation_manifest.json'

permissions:
  contents: write

concurrency:
  group: flighttempo-navigation-update
  cancel-in-progress: false

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run IFR importer unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build OurAirports reference datasets
        run: python3 scripts/build_aviation_db.py
      - name: Import optional IFR route network
        run: |
          python3 scripts/import_xplane_navdata.py \
            --source-dir navigation/sources/flightgear \
            --manifest navigation_manifest.json \
            --optional
      - name: Verify generated datasets and manifest
        run: |
          set -e
          test -s app/src/main/assets/airports.csv
          test -s navigation/navaids/navaids.csv
          test -s navigation/runways/runways_parsed.csv
          test -s navigation_manifest.json
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("navigation_manifest.json").read_text())
          assert manifest["schemaVersion"] == 11, "Unexpected manifest schema version"
          for relative in (
              "app/src/main/assets/airports.csv",
              "navigation/navaids/navaids.csv",
              "navigation/runways/runways_parsed.csv",
          ):
              path = Path(relative)
              with path.open(encoding="utf-8", newline="") as handle:
                  count = max(0, sum(1 for _ in csv.reader(handle)) - 1)
              assert count > 0, f"No records in {relative}"
              print(f"{relative}: {count} records")
          for dataset in manifest.get("datasets", []):
              if not dataset.get("available"):
                  continue
              path = Path(dataset["path"])
              assert path.is_file(), f"Manifest points to missing file: {path}"
              assert path.stat().st_size == dataset["sizeBytes"], f"Size mismatch: {path}"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == dataset["sha256"]
              with path.open(encoding="utf-8", newline="") as handle:
                  count = max(0, sum(1 for _ in csv.reader(handle)) - 1)
              assert count == dataset["recordCount"], f"Record count mismatch: {path}"
              print(f"{dataset['id']}: {count} records; {path.stat().st_size} bytes")
          print("Manifest and available datasets validated.")
          PY
      - name: Commit updated datasets
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            navigation/navaids/flightgear_navaids.csv \
            navigation/waypoints/flightgear_fixes.csv \
            navigation/airways/flightgear_airway_segments.csv \
            navigation/sources/flightgear/import_metadata.json \
            navigation_manifest.json \
            app/src/main/assets/airports.csv \
            navigation/navaids/navaids.csv \
            navigation/runways/runways_parsed.csv
          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi
          git commit -m "chore(navdata): update verified aviation datasets [skip ci]"
          git push origin HEAD:main
