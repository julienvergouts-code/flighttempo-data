name: Update Airports & Navigation Data

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'navigation/**'
      - 'procedures/**'
      - 'airports/**'
      - 'airlines/**'
      - '.github/workflows/update-navigation-data.yml'
      - 'navigation_manifest.json'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'navigation/**'
      - 'procedures/**'
      - 'airports/**'
      - 'airlines/**'
      - '.github/workflows/update-navigation-data.yml'
      - 'navigation_manifest.json'

permissions:
  contents: write

concurrency:
  group: flighttempo-navigation-update
  cancel-in-progress: false

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Aero.Sors workbook parser
        run: python3 -m pip install -r requirements-aerosors.txt
      - name: Run IFR importer unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install French SIA procedure PDF parser
        run: python3 -m pip install -r requirements-sia-procedures.txt
      - name: Smoke-test extraction against current official SIA SID and STAR tables
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_URL="https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_29_OCT_2026/FRANCE/AIRAC-2026-10-29/html/eAIP/Cartes"
          mkdir -p /tmp/flighttempo-sia-pdfs
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE_URL/LFPG/AD_2_LFPG_DATA_SID_RWY26L-26R_RNAV_CODE_02.pdf" \
            -o /tmp/flighttempo-sia-pdfs/AD_2_LFPG_DATA_SID_RWY26L-26R_RNAV_CODE_02.pdf
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE_URL/LFPG/AD_2_LFPG_DATA_STAR_RWY26L_RNAV_CODE_02.pdf" \
            -o /tmp/flighttempo-sia-pdfs/AD_2_LFPG_DATA_STAR_RWY26L_RNAV_CODE_02.pdf
          python3 scripts/import_sia_eaip_procedures.py \
            --pdf-dir /tmp/flighttempo-sia-pdfs \
            --airac-effective-date 2026-10-29 \
            --source-base-url "$BASE_URL" \
            --output /tmp/flighttempo-sia-pilot.csv \
            --manifest /tmp/flighttempo-sia-pilot-manifest.json
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          rows = list(csv.DictReader(Path("/tmp/flighttempo-sia-pilot.csv").open(encoding="utf-8", newline="")))
          assert rows, "SIA smoke test extracted no procedure legs"
          counts = {kind: sum(row["procedure_type"] == kind for row in rows) for kind in ("SID", "STAR")}
          assert all(count > 0 for count in counts.values()), f"SID/STAR table extraction failed: {counts}"
          assert all(row["airport_icao"] == "LFPG" for row in rows)
          assert all(row["path_terminator"] for row in rows)
          manifest = json.loads(Path("/tmp/flighttempo-sia-pilot-manifest.json").read_text())
          assert manifest["operationallyAvailable"] is False
          print(f"SIA LFPG procedure table smoke test passed: {counts}; total={len(rows)}")
          PY
      - name: Build OurAirports reference datasets
        run: python3 scripts/build_aviation_db.py
      - name: Import optional global IFR fixes and navaids
        run: |
          python3 scripts/import_xplane_navdata.py \
            --source-dir navigation/sources/flightgear \
            --manifest navigation_manifest.json \
            --optional
      - name: Enrich airport reference with OurAirports runway and elevation data
        run: python3 scripts/enrich_airport_reference.py
      - name: Import Aero.Sors worldwide VOR/NDB and ILS tables (experimental)
        run: python3 scripts/import_aerosors_tables.py --manifest navigation_manifest.json --optional
      - name: Import Aero.Sors worldwide Google Earth navaids and airports (experimental)
        run: python3 scripts/import_aerosors_kmz.py --manifest navigation_manifest.json --optional
      - name: Verify generated datasets and manifest
        run: |
          set -e
          test -s airports/airports.csv
          test -s airlines/airlines.csv
          test -s airlines/route_rules.csv
          test -s navigation/airports/ourairports_airports/airports.csv
          test -s navigation/navaids/navaids.csv
          test -s navigation/runways/runways_parsed.csv
          test -s navigation_manifest.json
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("navigation_manifest.json").read_text())
          assert manifest["schemaVersion"] == 13, "Unexpected manifest schema version"
          expected = {
              "airports/airports.csv": 1000,
              "navigation/airports/ourairports_airports/airports.csv": 1000,
              "navigation/navaids/navaids.csv": 1000,
              "navigation/runways/runways_parsed.csv": 500,
          }
          for relative, minimum in expected.items():
              path = Path(relative)
              with path.open(encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert len(rows) >= minimum, f"Too few records in {relative}: {len(rows)}"
              if relative.endswith("runways_parsed.csv"):
                  required = {"le_heading_degT", "he_heading_degT", "length_ft", "width_ft"}
                  assert required.issubset(rows[0].keys()), "Runway geometry columns missing"
              if relative.endswith("navaids.csv"):
                  required = {"frequency_khz", "dme_frequency_khz", "dme_latitude_deg",
                              "slaved_variation_deg", "usage_type"}
                  assert required.issubset(rows[0].keys()), "Navaid detail columns missing"
              print(f"{relative}: {len(rows)} records")
          for dataset in manifest.get("datasets", []):
              if not dataset.get("available"):
                  continue
              path = Path(dataset["path"])
              assert path.is_file(), f"Manifest points to missing file: {path}"
              assert path.stat().st_size == dataset["sizeBytes"], f"Size mismatch: {path}"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == dataset["sha256"]
              with path.open(encoding="utf-8", newline="") as handle:
                  rows = [row for row in csv.reader(handle)
                          if row and not row[0].strip().lower().startswith(("sep=", "#version"))]
                  count = max(0, len(rows) - 1)
              assert count == dataset["recordCount"], f"Record count mismatch: {path}"
              print(f"{dataset['id']}: {count} records; {path.stat().st_size} bytes")
          capabilities = manifest.get("capabilities", {})
          for capability in ("airports", "ourairportsAirports", "runways", "navaids", "vor", "dme", "ndb", "airlineProfiles", "rosterClassificationRules"):
              assert capabilities.get(capability) is True, f"Missing required capability: {capability}"
          for metric in ("airports", "runways", "navaids"):
              assert manifest.get("statistics", {}).get(metric, 0) > 0, f"Missing statistic: {metric}"
          profile = Path("airlines/airlines.csv").read_text(encoding="utf-8").splitlines()
          profile_lines = [line for line in profile if line.strip() and not line.startswith("sep=") and not line.startswith("#version")]
          assert profile_lines, "Airline profile catalogue missing"
          airline_header = next(csv.reader([profile_lines[0]], delimiter=";"))
          assert {"code", "displayName", "signOnMins", "iataCodes"}.issubset(set(airline_header)), "Airline profile schema mismatch"
          route_lines = [line for line in Path("airlines/route_rules.csv").read_text(encoding="utf-8").splitlines() if line.strip() and not line.startswith("#version")]
          assert route_lines and route_lines[0].split(",") == ["kind", "code"], "Route rules schema mismatch"
          print("Manifest, navigation datasets and airline profile packages validated.")
          PY
      - name: Commit updated datasets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            navigation/ \
            airports/airports.csv \
            airlines/airlines.csv \
            airlines/route_rules.csv \
            navigation_manifest.json
          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi
          git commit -m "chore(navdata): update verified aviation datasets [skip ci]"
          git push origin HEAD:main
