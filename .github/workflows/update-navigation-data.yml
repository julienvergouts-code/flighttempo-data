name: Update Aviation Navigation & CIFP Data

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Commercial Aviation Database
        run: python3 scripts/build_aviation_db.py

      - name: Validate Generated Files & Manifest
        run: |
          test -f navigation_manifest.json
          test -f app/src/main/assets/airports.csv
          test -s navigation/navaids/navaids.csv
          test -s navigation/runways/runways_parsed.csv
          test -s navigation/waypoints/waypoints.csv
          test -s navigation/airways/airways.csv
          cat navigation_manifest.json

      - name: Commit and Push Updated Datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A navigation/ app/src/main/assets/airports.csv navigation_manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(navdata): update commercial navigation and airport assets"
            git pull --rebase origin main
            git push origin main
          fi
