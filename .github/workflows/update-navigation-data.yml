name: Update Airports & Navigation Data

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and Validate Commercial Aviation Database
        run: python3 scripts/build_aviation_db.py

      - name: Commit and Push Updated Datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A navigation/ app/src/main/assets/airports.csv navigation_manifest.json
          if git diff --staged --quiet; then
            echo "No navigation data changes to commit."
          else
            git commit -m "chore(navdata): update commercial navigation and airport assets [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
