
name: Update Airports & Navigation Data

on:
  schedule:
    - cron: '15 4 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flighttempo-navigation-update
  cancel-in-progress: false

jobs:
  build-and-update-navdata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate aviation database
        run: |
          python3 scripts/build_aviation_db.py

      - name: Verify generated datasets
        run: |
          set -e

          test -s app/src/main/assets/airports.csv
          test -s navigation/navaids/navaids.csv
          test -s navigation/runways/runways_parsed.csv
          test -s navigation_manifest.json

          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("navigation_manifest.json").read_text()
          )

          assert manifest["schemaVersion"] == 10

          expected = [
              "app/src/main/assets/airports.csv",
              "navigation/navaids/navaids.csv",
              "navigation/runways/runways_parsed.csv",
          ]

          for filename in expected:
              path = Path(filename)
              assert path.exists() and path.stat().st_size > 0

              with path.open(encoding="utf-8") as f:
                  rows = list(csv.reader(f))

              assert len(rows) > 1, f"No records: {filename}"
              print(f"{filename}: {len(rows)-1} records")

          print("Manifest and datasets validated.")
          PY

      - name: Commit updated datasets
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            navigation/ \
            app/src/main/assets/airports.csv \
            navigation_manifest.json

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi

          git commit -m "chore(navdata): update verified aviation datasets [skip ci]"

          git push origin HEAD:main
