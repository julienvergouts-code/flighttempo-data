name: Monitor EUROCONTROL FRA source structure

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/monitor_eurocontrol_fra_sources.py'
      - 'tests/test_monitor_eurocontrol_fra_sources.py'
      - '.github/workflows/monitor-eurocontrol-fra-sources.yml'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook inspection dependency
        run: python -m pip install -r requirements-aerosors.txt
      - name: Unit tests
        run: python -m unittest tests.test_monitor_eurocontrol_fra_sources -v
      - name: Fetch latest FRA workbooks and inspect schema (temporary)
        run: python scripts/monitor_eurocontrol_fra_sources.py
      - name: Upload metadata report only
        uses: actions/upload-artifact@v4
        with:
          name: eurocontrol-fra-source-metadata
          path: fra_source_monitor_report.json
          retention-days: 14
