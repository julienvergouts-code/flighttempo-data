name: Probe SIA eAIP pages
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Paths under html/eAIP/ to dump (space separated), e.g. FR-ENR-4.4-fr-FR.html'
        required: false
        default: ''
      rows_from:
        description: 'Print 45 text rows starting at this index'
        required: false
        default: ''
      around:
        description: 'Comma list of coordinate-row ordinals to show with context'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EXTRA_PAGES: ${{ inputs.pages }}
      ROWS_FROM: ${{ inputs.rows_from }}
      AROUND: ${{ inputs.around }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_sia_eaip_enr.py
