name: Update EASA conflict-zone advisories

on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-easa-conflict-advisories.yml'
      - 'scripts/import_easa_czibs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openaip-fir-import
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download official EASA JSON export
        run: |
          mkdir -p airspace/advisories
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://www.easa.europa.eu/en/domains/air-operations/czibs/export-json?_format=json&page=' \
            --output airspace/advisories/easa_czibs_source.json
          python3 -m json.tool airspace/advisories/easa_czibs_source.json > /dev/null
      - name: Normalize advisories and route-preview filter
        run: python3 scripts/import_easa_czibs.py
      - name: Add EASA datasets to app download manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("navigation_manifest.json")
          m = json.loads(p.read_text())
          datasets = m.setdefault("datasets", [])
          for dataset_id, rel, purpose in [
              ("easa_czibs", "airspace/advisories/easa_czibs.json", "advisory_reference_only"),
              ("airspace_filter", "airspace/airspace_filter.json", "route_preview_advisory_filter_only"),
              ("easa_safety_directives", "airspace/advisories/easa_safety_directives.json", "safety_directive_reference_only"),
          ]:
              raw = Path(rel).read_bytes()
              record = {
                  "id": dataset_id, "path": rel,
                  "downloadUrl": "https://raw.githubusercontent.com/julienvergouts-code/flighttempo-data/main/" + rel,
                  "available": True,
                  "recordCount": (len(json.loads(raw).get("records", [])) if dataset_id in {"easa_czibs", "easa_safety_directives"} else len(json.loads(raw).get("activeAdvisories", []))),
                  "sizeBytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                  "sourceProvider": "European Union Aviation Safety Agency (EASA)",
                  "sourceUrl": ("https://ad.easa.europa.eu/ad/SD-2021-02" if dataset_id == "easa_safety_directives" else "https://www.easa.europa.eu/en/domains/air-operations/czibs"),
                  "license": ("EASA source acknowledged; metadata summary only, original directive linked and not redistributed" if dataset_id == "easa_safety_directives" else "EASA website copyright notice: reproduction authorised provided source is acknowledged"),
                  "licenseStatus": ("EASA_metadata_summary_source_acknowledged" if dataset_id == "easa_safety_directives" else "reproduction_authorised_with_source_acknowledgement"),
                  "dataCycle": "not_applicable", "downloadPurpose": purpose,
                  "operationallyAvailable": False,
                  "status": ("reference_only_operator_scope_verify" if dataset_id == "easa_safety_directives" else "advisory_reference_not_operational")
              }
              datasets = [d for d in datasets if d.get("id") != dataset_id]
              datasets.append(record)
          m["datasets"] = datasets
          m.setdefault("capabilities", {})["conflictZoneAdvisories"] = True
          m["capabilities"]["airspaceFilterAdvisoryOnly"] = True
          m["capabilities"]["hardNoFlyFIRRestrictions"] = False
          m["capabilities"]["easaSafetyDirectives"] = True
          m["capabilities"]["airspaceGeometryComplete"] = False
          m["capabilities"]["russiaCzibFirsEnumerated"] = True
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY
      - name: Verify EASA Russia and Minsk advisory coverage
        run: python3 tests/test_easa_airspace_coverage.py
      - name: Refresh repository provenance checksums
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json
          from pathlib import Path
          def record(path):
              raw = Path(path).read_bytes()
              return hashlib.sha256(raw).hexdigest(), len(raw)
          files = {
              "easa-czibs": "airspace/advisories/easa_czibs.json",
              "airspace-filter": "airspace/airspace_filter.json",
              "easa-safety-directive-minsk": "airspace/advisories/easa_safety_directives.json",
          }
          root_path = Path("manifest.json")
          root = json.loads(root_path.read_text())
          for item in root.get("datasets", []):
              rel = files.get(item.get("id"))
              if rel:
                  digest, size = record(rel)
                  item["sha256"] = digest
                  if item.get("id") == "airspace-filter":
                      item["recordCount"] = len(json.loads(Path(rel).read_text()).get("activeAdvisories", []))
          root["generatedAtUtc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          root_path.write_text(json.dumps(root, indent=2) + "\n")
          meta_path = Path("airspace/advisories/meta.json")
          meta = json.loads(meta_path.read_text())
          digest, size = record(files["easa-czibs"])
          meta["sha256"] = digest
          for item in meta.get("files", []):
              rel = "airspace/advisories/" + item.get("path", "")
              if rel in files.values():
                  item["sha256"], item["sizeBytes"] = record(rel)
          meta_path.write_text(json.dumps(meta, indent=2) + "\n")
          air_path = Path("airspace/meta.json")
          air = json.loads(air_path.read_text())
          for item in air.get("files", []):
              if item.get("path") == "airspace_filter.json":
                  item["sha256"], item["sizeBytes"] = record(files["airspace-filter"])
          air_path.write_text(json.dumps(air, indent=2) + "\n")
          PY
      - name: Commit refreshed advisory datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airspace/advisories airspace/airspace_filter.json navigation_manifest.json manifest.json airspace/meta.json
          git commit -m "data(airspace): refresh official EASA conflict-zone advisories" || echo "No advisory changes"
          git pull --rebase origin main
          git push
