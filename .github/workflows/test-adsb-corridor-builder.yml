name: ADS-B corridor builder unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/adsb_learning/**"
      - "scripts/route_preview.py"
      - "pipeline/**"
      - "tests/test_adsb_corridor_builder.py"
      - "tests/test_ftwg_binary_reader.py"
      - ".github/workflows/test-adsb-corridor-builder.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to test"
        required: true
        default: "feature/adsb-route-learning"
        type: string

permissions:
  contents: read

concurrency:
  group: adsb-unit-tests-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Compile archive pipeline and diagnostic exporter
        run: python -m py_compile pipeline/build_corridors.py pipeline/batch_archive_benchmark.py pipeline/compile_ftwg_graph.py scripts/adsb_learning/build_corridors.py scripts/adsb_learning/export_ftwg_diag.py
      - name: Run ADS-B corridor unit tests
        run: |
          python -m unittest discover -s tests -p "test_adsb_corridor_builder.py" -v
          python -m unittest discover -s tests -p "test_ftwg_binary_reader.py" -v
