name: ADS-B corridor builder unit tests
on:
  pull_request:
    paths:
      - "scripts/adsb_learning/**"
      - "scripts/route_preview.py"
      - "pipeline/**"
      - "tests/test_adsb_corridor_builder.py"
      - ".github/workflows/test-adsb-corridor-builder.yml"
  push:
    branches: [feature/adsb-route-learning]
    paths:
      - "scripts/adsb_learning/**"
      - "scripts/route_preview.py"
      - "pipeline/**"
      - "tests/test_adsb_corridor_builder.py"
      - ".github/workflows/test-adsb-corridor-builder.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ADS-B corridor unit tests
        run: python -m unittest discover -s tests -p "test_adsb_corridor_builder.py" -v
