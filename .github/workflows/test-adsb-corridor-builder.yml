name: ADS-B corridor builder unit tests

# Tests for the ADS-B observed-routes pipeline only. It runs when those files change, not for every change under pipeline/.
on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/adsb_*.py"
      - "pipeline/requirements.txt"
      - "scripts/register_adsb_observed_manifest.py"
      - "scripts/commercial_rights.py"
      - "tests/test_adsb_observed_routes.py"
      - "tests/test_register_adsb_observed_manifest.py"
      - ".github/workflows/test-adsb-corridor-builder.yml"
      - ".github/workflows/update-adsb-observed-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsb-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Compile pipeline modules
        run: python -m py_compile pipeline/adsb_archive.py pipeline/adsb_observed_routes.py scripts/register_adsb_observed_manifest.py
      - name: Run ADS-B unit tests
        run: python -m unittest tests.test_adsb_observed_routes tests.test_register_adsb_observed_manifest tests.test_personal_use_scope -v
