name: ADS-B pipeline tests
on:
  push:
    branches: [main, "feature/adsb-observed-corridor-pipeline"]
    paths: ["pipeline/**", ".github/workflows/adsb-pipeline-tests.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/adsb-pipeline-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s pipeline/tests -v
