name: ADS-B observed corridor pipeline

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Direct URL to a single downloaded/extracted trace archive (not a multi-part release)
        required: true
        type: string
      origin:
        description: Origin airport ICAO
        required: true
        default: EBLG
        type: string
      destination:
        description: Destination airport ICAO
        required: true
        default: LGAV
        type: string
      date:
        description: UTC archive date YYYY-MM-DD
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Download supplied archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          python - <<'PY'
          import os, urllib.request
          url=os.environ["ARCHIVE_URL"]
          if not url.startswith("https://"): raise SystemExit("Only HTTPS archive URLs are accepted")
          urllib.request.urlretrieve(url, "/tmp/adsb-archive")
          PY
      - name: Extract archive
        run: |
          mkdir -p /tmp/adsb-traces
          case "$(file -b /tmp/adsb-archive)" in
            *gzip*) tar -xzf /tmp/adsb-archive -C /tmp/adsb-traces ;;
            *POSIX\ tar*) tar -xf /tmp/adsb-archive -C /tmp/adsb-traces ;;
            *) echo "Unsupported archive format; provide a single .tar or .tar.gz archive"; exit 1 ;;
          esac
      - name: Run ingestion
        run: |
          python pipeline/adsb_fetch.py --input-dir /tmp/adsb-traces/traces --origin "${{ inputs.origin }}" --destination "${{ inputs.destination }}" --date "${{ inputs.date }}"
      - name: Run corridor clustering
        run: python pipeline/corridor_cluster.py --input-dir observed_traces --fixes navigation/waypoints/flightgear_fixes.csv
      - name: Validate (fail closed)
        run: python pipeline/validation.py --input preferred_routes/europe.json --fixes navigation/waypoints/flightgear_fixes.csv
      - name: Upload generated candidates
        uses: actions/upload-artifact@v4
        with:
          name: observed-corridor-candidates
          path: |
            observed_traces/
            preferred_routes/
