name: Probe Open-Meteo global pressure-level forecast

on:
  push:
    branches: [main]
    paths:
      - 'weather/probe_open_meteo_pressure_levels.py'
      - '.github/workflows/probe-open-meteo-weather.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flighttempo-open-meteo-weather-probe
  cancel-in-progress: false

jobs:
  probe-open-meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe EBBR multi-level wind and temperature forecast
        run: python3 weather/probe_open_meteo_pressure_levels.py --output weather/open-meteo/pressure-level-probe.json
      - name: Publish metadata-only probe report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/open-meteo/pressure-level-probe.json
          if git diff --cached --quiet; then
            echo "Open-Meteo pressure-level metadata report is unchanged."
            exit 0
          fi
          git commit -m "chore(weather): refresh Open-Meteo pressure-level probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
