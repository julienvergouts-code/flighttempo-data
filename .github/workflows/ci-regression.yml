name: FlightTempo Data Regression CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "**/*manifest*.json"
      - "**/*.csv"
      - "**/*.bin"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "**/*manifest*.json"
      - "**/*.csv"
      - "**/*.bin"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency for spreadsheet fixtures
        run: python -m pip install -r requirements-aerosors.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate OFMA VFR artifact
        run: python scripts/validate_vfr_data_artifacts.py
