name: Import configured OpenFlightMaps VFR reference points
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
  pull_request:
    paths:
      - pipeline/import_ofma_cup_points.py
      - data/ofma_sources.json
      - tests/test_import_ofma_cup_points.py
      - .github/workflows/import-ofma-vfr-points.yml
permissions:
  contents: write
concurrency:
  group: flighttempo-shared-manifest-updates
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_import_ofma_cup_points.py' -v
      - name: Import configured regions
        run: python pipeline/import_ofma_cup_points.py
      - name: Register manifest
        if: ${{ hashFiles('data/ofma_vfr_points.csv') != '' }}
        run: python scripts/register_ofma_vfr_points_manifest.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation_manifest.json
          if [ -f data/ofma_vfr_points.csv ]; then git add data/ofma_vfr_points.csv data/ofma_vfr_points_meta.json; fi
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update OFMA VFR reference points"; git push; fi
